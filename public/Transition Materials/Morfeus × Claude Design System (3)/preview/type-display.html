<!doctype html>
<html><head><meta charset="utf-8"><title>Display type — Clash Display</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { height: 220px; padding: 24px 28px; }
  .meta-row { display: flex; gap: 12px; align-items: baseline; margin-bottom: 8px; }
  .family { font-family: 'Clash Display', system-ui, sans-serif; font-weight: 600; color: #fff; font-size: 14px; letter-spacing: -0.01em; }
  .specs  { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--muted); }
  .big { font-family: 'Clash Display', system-ui, sans-serif; font-weight: 600; font-size: 56px; line-height: 1.02; letter-spacing: -0.025em; color: #fff; margin: 0; }
  .grades { display: flex; gap: 28px; margin-top: 18px; align-items: baseline; }
  .grade-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; display:block; }
  .grade-500 { font-family: 'Clash Display', system-ui, sans-serif; font-weight: 500; color: #fff; font-size: 26px; letter-spacing: -0.02em; }
  .grade-600 { font-family: 'Clash Display', system-ui, sans-serif; font-weight: 600; color: #fff; font-size: 26px; letter-spacing: -0.02em; }
  .grade-700 { font-family: 'Clash Display', system-ui, sans-serif; font-weight: 700; color: #fff; font-size: 26px; letter-spacing: -0.02em; }
</style></head>
<body>
  <div class="card">
    <div class="meta-row">
      <span class="family">Clash Display</span>
      <span class="specs">geometric sans · 500 / 600 / 700 · fallback: Plus Jakarta Sans</span>
    </div>
    <p class="big">Aa Bb Cc 0123</p>
    <div class="grades">
      <div><span class="grade-label">500</span><span class="grade-500">Regular</span></div>
      <div><span class="grade-label">600 · default</span><span class="grade-600">Semibold</span></div>
      <div><span class="grade-label">700</span><span class="grade-700">Bold</span></div>
    </div>
  </div>
</body></html>
