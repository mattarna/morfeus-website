<!doctype html>
<html><head><meta charset="utf-8"><title>Section label</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { height: 200px; padding: 30px 36px; font-family: 'Satoshi', Inter, sans-serif; }
  .label {
    font-family: 'Satoshi', Inter, sans-serif;
    font-weight: 700; font-size: 13px;
    color: #7B68EE; letter-spacing: 0.20em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 12px;
  }
  .label::before {
    content: ""; width: 24px; height: 1px; background: #7B68EE; opacity: 0.5;
  }
  .title {
    font-family: 'Clash Display', system-ui, sans-serif;
    font-weight: 600; font-size: 32px; color: #fff; letter-spacing: -0.02em;
    margin: 18px 0 0 0; line-height: 1.08;
  }
  .italic { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 500; color: #EB7A2E; }
  .spec { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: #9B9BB0; margin-top: 16px; }
</style>
</head>
<body>
  <div class="card">
    <span class="label">Il webinar</span>
    <h2 class="title">Un evento Morfeus. <span class="italic">Non</span> un webinar qualunque.</h2>
    <div class="spec">Satoshi 700 · 13 px · violet · +0.20em · uppercase · optional violet hairline prefix</div>
  </div>
</body></html>
