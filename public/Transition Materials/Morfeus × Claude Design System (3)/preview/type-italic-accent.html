<!doctype html>
<html><head><meta charset="utf-8"><title>Italic accent — Playfair Display</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { height: 240px; padding: 24px 28px; }
  .meta-row { display: flex; gap: 12px; align-items: baseline; margin-bottom: 14px; }
  .family { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 500; color: #EB7A2E; font-size: 18px; }
  .specs  { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--muted); }
  .sample {
    font-family: 'Clash Display', system-ui, sans-serif;
    font-weight: 600;
    font-size: 36px;
    line-height: 1.08;
    letter-spacing: -0.02em;
    color: #fff;
    margin: 0 0 16px 0;
    text-wrap: balance;
  }
  .accent { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 500; color: #EB7A2E; }
  .rule-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; }
  .rule { border-left: 2px solid rgba(255,255,255,0.12); padding-left: 12px; }
  .rule.ok    { border-color: #EB7A2E; }
  .rule.avoid { border-color: #9B9BB0; }
  .rule-label { font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .rule.ok .rule-label { color: #EB7A2E; }
  .rule p { margin: 0; font-size: 13px; color: var(--ghost); opacity: 0.85; line-height: 1.4; max-width: none; }
</style></head>
<body>
  <div class="card">
    <div class="meta-row">
      <span class="family">Playfair Display · italic</span>
      <span class="specs">serif · 500 default · 1–3 keywords per headline · always colored</span>
    </div>
    <p class="sample">Come usare Claude <span class="accent">al massimo</span> nel tuo lavoro</p>
    <div class="rule-row">
      <div class="rule ok">
        <div class="rule-label">Do</div>
        <p>1–3 emotive keywords inside an H1/H2, colored orange.</p>
      </div>
      <div class="rule avoid">
        <div class="rule-label">Don't</div>
        <p>Body text. Buttons. Labels. Same color as surrounding text.</p>
      </div>
    </div>
  </div>
</body></html>
