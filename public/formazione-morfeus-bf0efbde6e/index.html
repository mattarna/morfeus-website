html.dark{

--sh:0 1px 2px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;min-height:100vh}
.bar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:11px 24px;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);font-weight:500}
.mk{height:15px;color:var(--accent);transition:color .3s}
.brand .sep{width:1px;height:15px;background:var(--line-2)}
.brand .lz{font-family:var(--mono);background:var(--accent);color:#fff;padding:3px 10px;border-radius:30px;font-size:11.5px;font-weight:500;letter-spacing:.02em;transition:background .3s}
.tools{display:flex;align-items:center;gap:10px}
.lang{display:flex;background:var(--card);border:1px solid var(--line);border-radius:30px;overflow:hidden;font-family:var(--mono);font-size:12px;font-weight:600;box-shadow:var(--sh)}
.lang button{background:transparent;border:none;color:var(--ink-3);padding:6px 12px;cursor:pointer;font-family:var(--mono);transition:.18s}
.lang button.on{background:var(--accent);color:#fff}
.ic-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink-2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:var(--sh);transition:.18s}
.ic-btn:hover{color:var(--ink);border-color:var(--line-2)}
.wrap{max-width:860px;margin:0 auto;padding:92px 24px 64px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;display:flex;align-items:center;gap:8px;transition:color .3s}
.eyebrow::before{content:'//';opacity:.55}
h1{font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1.06;margin-bottom:14px}
.lede{font-size:17px;color:var(--ink-2);max-width:660px}
.tabs{display:flex;gap:4px;margin-top:34px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{appearance:none;border:0;background:transparent;font:inherit;cursor:pointer;padding:13px 18px;font-size:15.5px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:10px;transition:color .18s,border-color .18s}
.tab:hover{color:var(--ink-2)}
.tab .tn{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--bg-3);color:var(--ink-3);border-radius:30px;padding:2px 9px;transition:.18s}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab.on .tn{background:var(--accent);color:#fff}
.tab.ghost{color:var(--ink-3);opacity:.5;cursor:default;font-weight:500}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.stat{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:30px;box-shadow:var(--sh);padding:8px 16px;font-size:13px;color:var(--ink-2)}
.stat .sn{font-family:var(--mono);font-weight:700;color:var(--accent);font-size:15px;transition:color .3s}
.mods{margin-top:30px;display:flex;flex-direction:column;gap:12px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh);overflow:hidden;transition:border-color .18s}
.mod.open{border-color:var(--accent-line)}
.mhead{display:flex;align-items:center;gap:16px;padding:18px 20px;cursor:pointer;user-select:none}
.mnum{min-width:50px;height:46px;padding:0 10px;flex-shrink:0;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:15px;box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent);transition:background .3s}
.minfo{flex:1;min-width:0}
.mtitle{font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.msub{font-size:12.5px;color:var(--ink-3);font-family:var(--mono);margin-top:3px}
.chev{color:var(--ink-3);flex-shrink:0;transition:transform .3s cubic-bezier(.2,.7,.2,1),color .3s}
.mod.open .chev{transform:rotate(180deg);color:var(--accent)}
.mbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s cubic-bezier(.2,.7,.2,1)}
.mod.open .mbody{grid-template-rows:1fr}
.mbinner{overflow:hidden}
.lessons{padding:2px 14px 16px 14px;display:flex;flex-direction:column;gap:2px}
a.les{display:flex;align-items:center;gap:14px;text-decoration:none;padding:12px 14px;border-radius:var(--r);transition:background .15s;color:inherit}
a.les:hover{background:var(--accent-soft)}
.lid{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:7px;padding:5px 8px;min-width:54px;text-align:center;flex-shrink:0;transition:color .3s}
.lt{flex:1;min-width:0;font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.4}
.go{color:var(--ink-3);font-size:18px;flex-shrink:0;transition:transform .15s,color .15s}
a.les:hover .go{color:var(--accent);transform:translateX(2px)}
.foot{border-top:1px solid var(--line);padding-top:26px;margin-top:48px;text-align:center;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.foot a{color:var(--accent);text-decoration:none}.foot a:hover{text-decoration:underline}
.mf-legal{max-width:920px;margin:28px auto 0;padding:14px 18px;border:1px solid var(--line);border-radius:8px;font-size:11px;line-height:1.55;color:var(--ink-3);background:var(--bg-2)}
.mf-legal p{margin:0}
@media(max-width:640px){.wrap{padding:84px 16px 48px}h1{font-size:30px}.mhead{padding:15px 15px;gap:13px}.tab{padding:11px 13px;font-size:14px}.bar{padding:10px 14px}.tools{gap:8px}}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function T(){return UI[LANG]}
function applyAccent(){var t=TRACKS[active],dark=document.documentElement.classList.contains('dark');document.documentElement.style.setProperty('--accent',dark?t.accentD:t.accentL);}
function applyI18n(){
  var u=T();
  document.documentElement.lang=LANG;
  document.title=u.docT;
  document.getElementById('badge').textContent=u.badge;
  document.getElementById('eyebrow').textContent=u.eyebrow;
  document.getElementById('h1').textContent=u.h1;
  document.getElementById('lede').textContent=u.lede;
  document.getElementById('footTxt').textContent=u.foot;
  document.getElementById('legal').innerHTML=u.legal;
  document.getElementById('themeBtn').title=u.themeT;
}
function renderTabs(){
  var h='';
  TRACKS.forEach(function(t,i){h+='<button class="tab'+(i===active?' on':'')+'" onclick="setTab('+i+')">'+esc(LANG==='it'?t.label:t.labelEn)+'<span class="tn">'+t.total+'</span></button>';});
  h+='<span class="tab ghost">'+esc(T().more)+'</span>';
  document.getElementById('tabs').innerHTML=h;
}
function renderTrack(){
  var t=TRACKS[active],u=T(),q=(LANG==='en'?'?lang=en':'');
  document.getElementById('stats').innerHTML='<div class="stat"><span class="sn">'+t.total+'</span> '+esc(u.lessons)+'</div><div class="stat"><span class="sn">'+t.mods.length+'</span> '+esc(u.modules)+'</div>';
  var html='';
  t.mods.forEach(function(m,mi){
    var rows=m.lessons.map(function(l){
      return '<a class="les" target="_blank" rel="noopener" href="'+BASE+esc(l.slug)+'.html'+q+'"><span class="lid">'+esc(l.id)+'</span><span class="lt">'+esc(LANG==='it'?l.t:l.e)+'</span><span class="go">&#8599;</span></a>';
    }).join('');
    html+='<div class="mod'+(mi===0?' open':'')+'">'
      +'<div class="mhead" onclick="this.parentElement.classList.toggle(\'open\')">'
      +'<div class="mnum">'+esc(m.badge)+'</div>'
      +'<div class="minfo"><div class="mtitle">'+esc(LANG==='it'?m.title:m.titleEn)+'</div><div class="msub">'+m.lessons.length+' '+esc(m.lessons.length===1?u.les1:u.lesN)+'</div></div>'
      +'<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'
      +'</div><div class="mbody"><div class="mbinner"><div class="lessons">'+rows+'</div></div></div></div>';
  });
  document.getElementById('mods').innerHTML=html;
}
function setTab(i){active=i;applyAccent();renderTabs();renderTrack();window.scrollTo({top:0,behavior:'smooth'});}
function setLang(l){
  LANG=(l==='en')?'en':'it';
  try{localStorage.setItem('mf-lang',LANG)}catch(e){}
  document.querySelectorAll('.lang button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-l')===LANG)});
  applyI18n();renderTabs();renderTrack();
}
function toggleTheme(){var e=document.documentElement;e.classList.toggle('dark');try{localStorage.setItem('mf-th',e.classList.contains('dark')?'dark':'light')}catch(err){}applyAccent();}
(function(){try{if(localStorage.getItem('mf-th')==='dark')document.documentElement.classList.add('dark')}catch(e){}})();
(function(){
  var l='it';
  try{
    var p=new URLSearchParams(location.search).get('lang'),s=localStorage.getItem('mf-lang');
    l=(p==='en'||p==='it')?p:((s==='en'||s==='it')?s:'it');
  }catch(e){}
  LANG=l;
})();
applyAccent();setLang(LANG);
