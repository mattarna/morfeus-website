<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webinar Claude — Morfeus</title>
<link rel="stylesheet" href="../../colors_and_type.css">

<style>
  body { margin: 0; min-height: 100vh; }
  @keyframes badge-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes btn-pulse {
    0% { box-shadow: 0 4px 20px rgba(235,122,46,.35), 0 0 0 0 rgba(235,122,46,0.4); }
    70% { box-shadow: 0 4px 20px rgba(235,122,46,.35), 0 0 0 15px rgba(235,122,46,0); }
    100% { box-shadow: 0 4px 20px rgba(235,122,46,.35), 0 0 0 0 rgba(235,122,46,0); }
  }
  #root { position: relative; z-index: 1; }
  img { display: block; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="Sections.jsx"></script>

<script type="text/babel">
const { useState } = React;

function App() {
  const [screen, setScreen] = useState("landing"); // landing | thankyou
  const [email, setEmail] = useState("");

  const submit = (value) => {
    if (!value || !value.includes("@")) return;
    setEmail(value);
    setScreen("thankyou");
  };

  return (
    <div data-screen-label={screen === "landing" ? "Landing — Optin" : "Thank you"}>
      <window.Header />
      {screen === "landing" && (
        <>
          <window.Hero onSubmit={submit} />
          <window.ModulesSection />
          <window.AuthoritySection />
          <window.FinalCTA onClick={() => document.querySelector('input[type=email]')?.focus()} />
        </>
      )}
      {screen === "thankyou" && (
        <window.ThankYou email={email} onBack={() => setScreen("landing")} />
      )}
      <window.Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
