<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { height: 220px; padding: 26px 28px; font-family: 'Satoshi', Inter, sans-serif; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: flex-start; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .label { font-size: 10px; letter-spacing: 0.20em; text-transform: uppercase; color: #9B9BB0; font-weight: 700; }
  .btn {
    font-family: 'Satoshi', Inter, sans-serif;
    font-weight: 700; font-size: 16px; color: #fff;
    padding: 16px 22px;
    border-radius: 10px;
    background: #EB7A2E;
    box-shadow: 0 4px 20px rgba(235,122,46,0.35);
    border: none; cursor: pointer;
    transition: background .2s, box-shadow .2s, transform .2s;
    display: inline-flex; align-items: center; gap: 10px;
    align-self: flex-start;
  }
  .btn.hover   { background: #F09A5C; box-shadow: 0 6px 28px rgba(235,122,46,0.5); transform: translateY(-1px); }
  .btn.pressed { background: #D4652A; box-shadow: 0 2px 10px rgba(235,122,46,0.3); transform: translateY(0); }
  .btn-ghost {
    background: transparent; color: #E4E7F0; font-weight: 500; font-size: 15px;
    padding: 14px 18px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: none;
    align-self: flex-start;
  }
  .spec { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: #9B9BB0; line-height: 1.5; }
  .arrow { display: inline-block; transform: translateY(1px); }
</style></head>
<body>
  <div class="card">
    <div class="row">
      <div class="stack">
        <span class="label">Primary · rest</span>
        <button class="btn">Guarda il webinar <span class="arrow">→</span></button>
        <div class="spec">orange · glow .35 · radius 10</div>
      </div>
      <div class="stack">
        <span class="label">Primary · hover</span>
        <button class="btn hover">Guarda il webinar <span class="arrow">→</span></button>
        <div class="spec">orange-hover · glow .50 · lift −1 px</div>
      </div>
      <div class="stack">
        <span class="label">Primary · pressed</span>
        <button class="btn pressed">Guarda il webinar <span class="arrow">→</span></button>
        <div class="spec">orange-pressed · glow reduced</div>
      </div>
    </div>
    <div style="height: 22px"></div>
    <div class="stack">
      <span class="label">Secondary · ghost</span>
      <button class="btn-ghost">Scopri il corso</button>
    </div>
  </div>
</body></html>
