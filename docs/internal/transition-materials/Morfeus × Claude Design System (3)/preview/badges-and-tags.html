<!doctype html>
<html><head><meta charset="utf-8"><title>Badges & tags</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { height: 210px; padding: 26px 28px; font-family: 'Satoshi', Inter, sans-serif; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 16px; }
  .group-label { font-size: 10px; letter-spacing: 0.20em; text-transform: uppercase; color: #9B9BB0; font-weight: 700; width: 120px; }
  .badge {
    padding: 8px 16px; border-radius: 100px;
    background: rgba(235,122,46,0.10);
    border: 1px solid rgba(235,122,46,0.25);
    color: #EB7A2E; font-size: 12px; font-weight: 700;
    letter-spacing: 0.10em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #EB7A2E; box-shadow: 0 0 8px rgba(235,122,46,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.4; }
  }
  .tag {
    padding: 4px 10px; border-radius: 6px;
    background: rgba(123,104,238,0.12);
    border: 1px solid rgba(123,104,238,0.25);
    color: #7B68EE; font-size: 12px; font-weight: 700;
    letter-spacing: 0.05em;
  }
  .tag.uppercase { text-transform: uppercase; letter-spacing: 0.14em; }
  .spec { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: #9B9BB0; margin-top: 4px; }
</style></head>
<body>
  <div class="card">
    <div class="row">
      <span class="group-label">Badge</span>
      <span class="badge"><span class="dot"></span>Webinar gratuito</span>
      <span class="badge">60 min · Live</span>
    </div>
    <div class="spec" style="margin-left:120px">orange-10 % fill · orange-25 % border · pill radius · optional pulsing dot</div>

    <div class="row" style="margin-top: 24px">
      <span class="group-label">Tag</span>
      <span class="tag uppercase">Claude Projects</span>
      <span class="tag uppercase">Artifacts</span>
      <span class="tag uppercase">Workflow</span>
    </div>
    <div class="spec" style="margin-left:120px">violet-12 % fill · violet-25 % border · 6 px radius · structural tags</div>
  </div>
</body></html>
