<!doctype html>
<html><head><meta charset="utf-8"><title>Foundation colors</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { height: 180px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .swatch { height: 124px; }
  .night       { background: #0B0B0C; border-color: rgba(255,255,255,0.10); }
  .deep-space  { background: #0F0E1A; }
  .dusk        { background: #1A1535; }
  .swatch .name { color: #FFFFFF; }
  .swatch .hex  { color: rgba(255,255,255,0.55); }
</style></head>
<body>
  <div class="card">
    <div class="swatch night">
      <span class="name">Night</span>
      <span class="hex">#0B0B0C · primary bg</span>
    </div>
    <div class="swatch deep-space">
      <span class="name">Deep Space</span>
      <span class="hex">#0F0E1A · alt sections</span>
    </div>
    <div class="swatch dusk">
      <span class="name">Dusk</span>
      <span class="hex">#1A1535 · depth, cards</span>
    </div>
  </div>
</body></html>
