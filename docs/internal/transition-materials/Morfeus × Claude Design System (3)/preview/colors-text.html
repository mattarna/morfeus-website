<!doctype html>
<html><head><meta charset="utf-8"><title>Text colors</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { height: 200px; display: grid; grid-template-columns: 1.1fr 1fr 1fr 1fr; gap: 14px; }
  .swatch { height: 144px; background: #0B0B0C; border: 1px solid rgba(255,255,255,0.08); justify-content: space-between; }
  .sample { font-family: var(--font-body); font-weight: 500; font-size: 18px; line-height: 1.2; }
  .s-white  { color: #FFFFFF; }
  .s-ghost  { color: #E4E7F0; opacity: 0.88; }
  .s-ghost2 { color: #E4E7F0; opacity: 0.80; }
  .s-muted  { color: #9B9BB0; }
  .meta-row { display: flex; flex-direction: column; gap: 2px; }
  .ratio { font-size: 10px; color: var(--muted); letter-spacing: 0.10em; text-transform: uppercase; }
</style></head>
<body>
  <div class="card">
    <div class="swatch">
      <div class="sample s-white">Abc 123</div>
      <div class="meta-row"><span class="name" style="color:#fff">White</span><span class="hex" style="color:rgba(255,255,255,0.55)">#FFFFFF</span><span class="ratio">19.5:1 · AAA</span></div>
    </div>
    <div class="swatch">
      <div class="sample s-ghost">Abc 123</div>
      <div class="meta-row"><span class="name" style="color:#fff">Ghost · 88</span><span class="hex" style="color:rgba(255,255,255,0.55)">#E4E7F0</span><span class="ratio">~13:1 · AAA</span></div>
    </div>
    <div class="swatch">
      <div class="sample s-ghost2">Abc 123</div>
      <div class="meta-row"><span class="name" style="color:#fff">Ghost · 80</span><span class="hex" style="color:rgba(255,255,255,0.55)">body min</span><span class="ratio">~11:1 · AAA</span></div>
    </div>
    <div class="swatch">
      <div class="sample s-muted">Abc 123</div>
      <div class="meta-row"><span class="name" style="color:#fff">Muted</span><span class="hex" style="color:rgba(255,255,255,0.55)">#9B9BB0</span><span class="ratio">7.1:1 · AAA</span></div>
    </div>
  </div>
</body></html>
