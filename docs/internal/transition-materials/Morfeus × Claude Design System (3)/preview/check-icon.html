<!doctype html>
<html><head><meta charset="utf-8"><title>Check icon — authority list</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { height: 210px; padding: 26px 28px; font-family: 'Satoshi', Inter, sans-serif; }
  .list { display: flex; flex-direction: column; gap: 14px; }
  .item { display: flex; align-items: center; gap: 14px; }
  .check {
    width: 26px; height: 26px; border-radius: 6px;
    background: rgba(235,122,46,0.1);
    border: 1px solid #EB7A2E;
    color: #EB7A2E; font-size: 14px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .txt { font-size: 15px; color: #E4E7F0; opacity: 0.88; }
</style></head>
<body>
  <div class="card">
    <div class="list">
      <div class="item"><span class="check">✓</span><span class="txt">Workflow reali da copiare e usare subito.</span></div>
      <div class="item"><span class="check">✓</span><span class="txt">Niente prompt engineering accademico.</span></div>
      <div class="item"><span class="check">✓</span><span class="txt">Esempi dal mio lavoro vero, non demo finte.</span></div>
      <div class="item"><span class="check">✓</span><span class="txt">Q&amp;A in chiusura — rispondo a tutti.</span></div>
    </div>
  </div>
</body></html>
