name: quality-gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Public assets policy check
        run: npm run check:public-assets:strict

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # Gira DOPO il build perche' legge l'HTML costruito: e' l'unico
      # punto in cui si vede cosa arriva davvero al lettore inglese.
      # Intercetta il caso in cui il guscio della pagina e' tradotto ma
      # i contenuti no, che non fa fallire ne' build ne' typecheck.
      - name: Copy inglese senza italiano
        run: npm run check:en-copy
